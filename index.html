<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stable Video Player</title>
<style>
body{
  margin:0;
  background:black;
  overflow:hidden;
  font-family:Arial;
}
#container{
  position:relative;
  width:100vw;
  height:100vh;
}
video{
  width:100%;
  height:100%;
  object-fit: cover;   /* This removes black bars */
  background:black;
}
#controls{
  position:absolute;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.8);
  padding:15px;
  border-radius:12px;
  display:flex;
  gap:10px;
  align-items:center;
  transition:opacity 0.3s;
}
button, select, input{
  font-size:16px;
  padding:6px 10px;
}
.hidden{
  opacity:0;
}
</style>
</head>
<body>

<div id="container">
  <video id="video" playsinline>
    <source src="https://file-to-link-2-b9adb11c51b5.herokuapp.com/dl/6a4219d5a74c85c85ce6427b" type="video/mp4">
  </video>

  <div id="controls">
    <button onclick="backward()">⏪ 10s</button>
    <button onclick="togglePlay()" id="playBtn">▶</button>
    <button onclick="forward()">10s ⏩</button>

    <select onchange="changeSpeed(this.value)">
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2x</option>
    </select>

    <input type="number" id="minuteInput" placeholder="Minute (e.g 120)" style="width:150px;">
    <button onclick="jumpToMinute()">Go</button>

    <button onclick="toggleFullscreen()">⛶</button>
  </div>
</div>

<script>
var video = document.getElementById("video");
var controls = document.getElementById("controls");
var playBtn = document.getElementById("playBtn");
var hideTimer;

// ✅ PLAY / PAUSE
function togglePlay(){
  if(video.paused){
    video.play();
    playBtn.innerHTML="⏸";
  } else {
    video.pause();
    playBtn.innerHTML="▶";
  }
}

// ✅ FORWARD
function forward(){
  if(video.readyState >= 1){
    video.currentTime = video.currentTime + 10;
  }
}

// ✅ BACKWARD
function backward(){
  if(video.readyState >= 1){
    video.currentTime = Math.max(0, video.currentTime - 10);
  }
}

// ✅ SPEED
function changeSpeed(speed){
  video.playbackRate = speed;
}

// ✅ SAFE JUMP TO MINUTE (Mobile Safe)
function jumpToMinute(){
  var m = parseFloat(document.getElementById("minuteInput").value);
  if(!isNaN(m)){
    if(video.readyState >= 1){
      video.currentTime = m * 60;
      video.play();
    } else {
      video.addEventListener("loadedmetadata", function(){
        video.currentTime = m * 60;
        video.play();
      }, {once:true});
    }
  }
}

// ✅ FULLSCREEN
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

// ✅ KEYBOARD / TV REMOTE SUPPORT
document.addEventListener("keydown", function(e){
  switch(e.keyCode){
    case 37: backward(); break;  // Left
    case 39: forward(); break;   // Right
    case 13: togglePlay(); break; // OK
    case 32: togglePlay(); break; // Space
  }
  showControls();
});

// ✅ AUTO HIDE CONTROLS
function showControls(){
  controls.classList.remove("hidden");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(function(){
    controls.classList.add("hidden");
  }, 5000);
}

document.addEventListener("mousemove", showControls);
document.addEventListener("touchstart", showControls);
video.addEventListener("click", togglePlay);

showControls();
</script>

</body>
</html>  font-size:22px;

<body>

<div id="container">
  <video id="video" autoplay muted>
    <source src="https://file-to-link-2-b9adb11c51b5.herokuapp.com/dl/6a4219d5a74c85c85ce6427b" type="video/mp4">
  </video>

  <div id="controls">
    <button onclick="backward()">⏪ 10s</button>
    <button onclick="togglePlay()" id="playBtn">▶</button>
    <button onclick="forward()">10s ⏩</button>

    <select onchange="video.playbackRate=this.value">
      <option value="1" selected>1x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2x</option>
    </select>

    <input type="number" id="minuteInput" placeholder="Minute" style="width:140px;">
    <button onclick="jumpToMinute()">Go</button>

    <button onclick="toggleFullscreen()">⛶</button>
  </div>
</div>

<script>
var video = document.getElementById("video");
var controls = document.getElementById("controls");
var playBtn = document.getElementById("playBtn");
var hideTimer;

// Play / Pause
function togglePlay(){
  if(video.paused){
    video.play();
    playBtn.innerHTML="⏸";
  } else {
    video.pause();
    playBtn.innerHTML="▶";
  }
}

// Forward / Back
function forward(){ video.currentTime += 10; }
function backward(){ video.currentTime -= 10; }

// Jump to minute
function jumpToMinute(){
  var m = parseFloat(document.getElementById("minuteInput").value);
  if(!isNaN(m)){
    video.currentTime = m * 60;
  }
}

// Fullscreen
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

// ✅ TV Remote Key Support
document.addEventListener("keydown", function(e){
  switch(e.keyCode){
    case 37: backward(); break;     // Left arrow
    case 39: forward(); break;      // Right arrow
    case 13: togglePlay(); break;   // OK button
    case 38: video.playbackRate += 0.25; break; // Up
    case 40: video.playbackRate -= 0.25; break; // Down
  }
  showControls();
});

// Auto-hide controls after 5 sec
function showControls(){
  controls.classList.remove("hidden");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(function(){
    controls.classList.add("hidden");
  },5000);
}

document.addEventListener("mousemove", showControls);
showControls();
</script>

</body>
</html>
