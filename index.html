<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TV Player</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:black;
  height:100%;
  overflow:hidden;
}
.player{
  position:relative;
  width:100vw;
  height:100vh;
}
video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:black;
}
.btn{
  position:absolute;
  background:rgba(0,0,0,0.6);
  color:white;
  border:none;
  border-radius:50%;
  font-size:22px;
  padding:18px;
}
.back{left:30px;top:50%;transform:translateY(-50%);}
.forward{right:30px;top:50%;transform:translateY(-50%);}
.center{left:50%;top:50%;transform:translate(-50%,-50%);}

.minute-box{
  position:absolute;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.6);
  padding:10px;
  border-radius:8px;
  color:white;
}

.hide{
  opacity:0;
  pointer-events:none;
  transition:0.3s;
}
</style>
</head>

<body>

<div class="player" id="player">

<video id="video" playsinline webkit-playsinline>
  <source src="https://file-to-link-x-c97f657694b4.herokuapp.com/dl/6984cd212b4ec5bd33819823" type="video/mp4">
</video>

<button class="btn back" onclick="seek(-10)">⏪</button>
<button class="btn center" id="playBtn" onclick="togglePlay()">▶</button>
<button class="btn forward" onclick="seek(10)">⏩</button>

<div class="minute-box" id="minuteBox">
  <input type="number" id="minuteInput" placeholder="Minute">
  <button onclick="jump()">Go</button>
</div>

</div>

<script>
var video=document.getElementById("video");
var playBtn=document.getElementById("playBtn");
var minuteBox=document.getElementById("minuteBox");
var player=document.getElementById("player");
var timer;

/* PLAY */
function togglePlay(){
  if(video.paused){
    video.play().catch(()=>{});
    playBtn.innerHTML="⏸";
  }else{
    video.pause();
    playBtn.innerHTML="▶";
  }
  show();
}

/* SEEK */
function seek(s){
  if(video.readyState>=1){
    video.currentTime+=s;
  }
  show();
}

/* JUMP */
function jump(){
  var m=parseFloat(document.getElementById("minuteInput").value);
  if(!isNaN(m)){
    video.currentTime=m*60;
    video.play().catch(()=>{});
  }
  show();
}

/* AUTO HIDE 10s */
function show(){
  minuteBox.classList.remove("hide");
  playBtn.classList.remove("hide");
  clearTimeout(timer);
  timer=setTimeout(()=>{
    minuteBox.classList.add("hide");
    playBtn.classList.add("hide");
  },10000);
}

/* REMOTE */
document.addEventListener("keydown",e=>{
  show();
  if(e.key==="ArrowLeft")seek(-10);
  if(e.key==="ArrowRight")seek(10);
  if(e.key==="Enter")togglePlay();
});

["click","mousemove","touchstart"].forEach(e=>{
  player.addEventListener(e,show);
});

show();
</script>

</body>
</html>
